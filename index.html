<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aktien-Tool</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaed;--mut:#8b93a1;--up:#2ecc71;--dn:#ff5c5c;--ac:#5b9dff}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}main{min-width:0}.card{overflow-x:auto}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,system-ui,sans-serif;padding-bottom:70px}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:17px;margin:0}h2{font-size:15px;margin:18px 0 8px}
main{padding:12px 14px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
input,textarea,button{font:inherit;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--tx);padding:10px 12px}
input:not([type=checkbox]),textarea{width:100%}textarea{resize:vertical}button{background:var(--ac);border:0;color:#fff;cursor:pointer}
button.sec{background:var(--card);border:1px solid var(--line);color:var(--tx)}
button.sm{padding:6px 10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;color:var(--mut);padding:14px 4px}
nav button.on{color:var(--tx);border-top:2px solid var(--ac)}
.tick{font-weight:600}.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
#chart{height:280px;margin-bottom:8px;width:100%;overflow:hidden}
.sc{border-left:3px solid var(--ac);padding-left:10px;margin:10px 0}
.sc.no{border-color:var(--dn)}.sc.go{border-color:var(--up)}
.tag{display:inline-block;background:#222836;border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:var(--mut)}
a{color:var(--ac)}
.star{background:none;border:0;color:#f5a623;font-size:22px;padding:0 6px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cd{min-height:62px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;font-size:11px;overflow:hidden}
.cd b{display:block;color:var(--mut);font-weight:400}.cd.today{border-color:var(--ac)}
.ev{display:block;background:#222836;border-radius:4px;padding:0 3px;margin-top:2px;font-size:10px;cursor:pointer;overflow:hidden}
.ev.fav{background:#5b4a14;color:#ffd77a}
.card.hint{border-color:#f5a623}
tr[data-t]{cursor:pointer}
nav button{font-size:13px}
.disc{font-size:12px;color:var(--mut);margin-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL="https://rwdgadfzdjsppdmnbrnz.supabase.co";
const SB_KEY="sb_publishable_s0l4ftRQasQ_HWLGjAsCNA_dB6PHQu3";
const sb=supabase.createClient(SB_URL,SB_KEY);
const SUGGEST=["AAPL","MSFT","GOOGL","AMZN","META","NVDA","TSLA","AVGO","AMD","NFLX","ORCL","PLTR","JPM","LLY","COST"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=(n,d=2)=>n==null||isNaN(n)?"–":Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=n=>n==null||isNaN(n)?"–":`<span class="${n>=0?"up":"dn"}">${n>=0?"+":""}${f(n)} %</span>`;
let session=null,watch=[],tab="watch",cache={};

/* ---------- Finnhub über Edge Function ---------- */
async function fh(path,params={}){
  const k=path+JSON.stringify(params);
  const c=cache[k];if(c&&Date.now()-c.t<60000)return c.v;
  const {data:{session:s}}=await sb.auth.getSession();
  const r=await fetch(`${SB_URL}/functions/v1/finnhub`,{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token,"apikey":SB_KEY},
    body:JSON.stringify({path,params})});
  const t=await r.text();let v;try{v=JSON.parse(t)}catch{v=t}
  if(!r.ok)throw new Error((v&&v.error)||("HTTP "+r.status+" "+String(t).slice(0,120)));
  cache[k]={t:Date.now(),v};return v;
}

/* ---------- Indikatoren ---------- */
const sma=(a,n)=>a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
function rsi(c,n=14){if(c.length<=n)return null;let g=0,l=0;
  for(let i=1;i<=n;i++){const d=c[i]-c[i-1];d>=0?g+=d:l-=d}
  g/=n;l/=n;
  for(let i=n+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l)}
function atr(h,l,c,n=14){if(c.length<=n)return null;const tr=[];
  for(let i=1;i<c.length;i++)tr.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  let a=tr.slice(0,n).reduce((x,y)=>x+y,0)/n;for(let i=n;i<tr.length;i++)a=(a*(n-1)+tr[i])/n;return a}
function levels(h,l,c){ // einfache Swing-Hoch/Tief-Levels der letzten 60 Tage
  const n=c.length,from=Math.max(2,n-60),res=[],sup=[];
  for(let i=from;i<n-2;i++){
    if(h[i]>h[i-1]&&h[i]>h[i-2]&&h[i]>h[i+1]&&h[i]>h[i+2])res.push(h[i]);
    if(l[i]<l[i-1]&&l[i]<l[i-2]&&l[i]<l[i+1]&&l[i]<l[i+2])sup.push(l[i])}
  const last=c[n-1];
  return{res:res.filter(x=>x>last).sort((a,b)=>a-b),sup:sup.filter(x=>x<last).sort((a,b)=>b-a)}}

/* ---------- Szenarien (regelbasiert, keine Empfehlung) ---------- */
function scenarios(d,earn){
  const {c,h,l}=d,n=c.length,last=c[n-1],a=atr(h,l,c),r=rsi(c);
  const s20=sma(c,20)[n-1],s50=sma(c,50)[n-1],lv=levels(h,l,c);
  const hi20=Math.max(...h.slice(-20)),lo20=Math.min(...l.slice(-20));
  const out=[];
  const near=earn&&earn.days!=null&&earn.days>=0&&earn.days<=3;
  if(near)out.push({t:"no",h:"Kein Einstieg vor Earnings",b:`Earnings in ${earn.days} Tag(en). Kursreaktion ist ein Münzwurf mit Gap-Risiko; Stop-Kurse greifen bei Gaps nicht zuverlässig. Erst nach der Reaktion neu bewerten.`});
  if(r>75)out.push({t:"no",h:"Überhitzt",b:`RSI ${f(r,0)}: Einstieg jetzt bietet ein schlechtes Chance-Risiko-Verhältnis. Besser auf Rücksetzer Richtung ${f(s20)} (20-Tage-Linie) warten.`});
  if(r<25)out.push({t:"no",h:"Fallendes Messer",b:`RSI ${f(r,0)}: stark überverkauft, aber ohne Stabilisierung kein Einstieg. Warten auf höheres Tief oder Schlusskurs über ${f(s20)}.`});
  const up=s20&&s50&&last>s20&&s20>s50;
  // Breakout
  {const e=hi20*1.001,st=e-1.5*a,t1=e+2*a,t2=lv.res.find(x=>x>t1)??e+3*a;
   out.push({t:up?"go":"",h:"Szenario A – Ausbruch",b:`Einstieg, wenn der Kurs über ${f(e)} (20-Tage-Hoch) schließt. Stop ${f(st)} (1,5 × ATR). Ziele ${f(t1)} und ${f(t2)}. CRV ca. ${f((t1-e)/(e-st),1)} : 1.${up?" Trend (Kurs > SMA20 > SMA50) spricht dafür.":" Trend ist nicht eindeutig aufwärts – Ausbruch eher skeptisch sehen."}`})}
  // Pullback
  {const sp=lv.sup[0]??lo20,e=Math.max(sp,s20??sp),st=sp-0.5*a,t1=Math.min(hi20,e+2*a);
   out.push({t:"",h:"Szenario B – Rücksetzer",b:`Einstieg bei Stabilisierung nahe ${f(e)} (20-Tage-Linie bzw. Unterstützung ${f(sp)}). Stop ${f(st)}. Ziel ${f(t1)}. CRV ca. ${f((t1-e)/(e-st),1)} : 1. Gilt nur, solange der Kurs nicht unter ${f(sp)} schließt.`})}
  // Short / Bruch
  out.push({t:"",h:"Szenario C – Bruch nach unten",b:`Schließt der Kurs unter ${f(lo20)} (20-Tage-Tief), ist die Seitwärts-/Aufwärtsstruktur gebrochen: Long-Ideen verwerfen, nächstes Level ${f(lv.sup[1]??lo20-2*a)}.`});
  return{out,ind:{last,s20,s50,r,a,atrPct:a/last*100,hi20,lo20,lv}}}

/* ---------- Auth ---------- */
function loginView(){
  $("#app").innerHTML=`<main><div class="card" style="margin-top:12vh"><h1>Aktien-Tool</h1><p class="mut">Anmeldung</p>
  <input id="em" type="email" placeholder="E-Mail" autocomplete="email"><div style="height:8px"></div>
  <input id="pw" type="password" placeholder="Passwort (min. 8 Zeichen)" autocomplete="current-password"><div style="height:10px"></div>
  <div class="row"><button id="in">Anmelden</button><button id="up" class="sec">Registrieren</button></div><p id="msg" class="mut"></p></div></main>`;
  $("#in").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});if(error)$("#msg").textContent=error.message};
  $("#up").onclick=async()=>{const {data,error}=await sb.auth.signUp({email:$("#em").value,password:$("#pw").value});
    $("#msg").textContent=error?error.message:(data.session?"":"Bitte E-Mail bestätigen, dann anmelden.")};
}

/* ---------- Layout ---------- */
function shell(){
  $("#app").innerHTML=`<header><h1>Aktien-Tool</h1><button class="sec sm" id="out">Abmelden</button></header><main id="v"></main>
  <nav><button data-t="watch">Watchlist</button><button data-t="fav">★</button><button data-t="cal">Kalender</button><button data-t="notes">Notizen</button><button data-t="diag">Status</button></nav>`;
  $("#out").onclick=()=>sb.auth.signOut();
  document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
  go(tab);
}
function go(t,arg){tab=t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  ({watch:()=>viewWatch(false),fav:()=>viewWatch(true),cal:viewCal,notes:viewNotes,diag:viewDiag,stock:()=>viewStock(arg)})[t]()}

async function loadWatch(){const {data}=await sb.from("watchlist").select("*").order("created_at");watch=data||[]}

/* ---------- Watchlist / Favoriten ---------- */
async function toggleFav(w){const {error}=await sb.from("watchlist").update({favorite:!w.favorite}).eq("ticker",w.ticker);if(!error)w.favorite=!w.favorite}
async function viewWatch(fav=false){
  await loadWatch();
  const items=fav?watch.filter(w=>w.favorite):[...watch].sort((a,b)=>(b.favorite-a.favorite));
  $("#v").innerHTML=`${fav?`<h2 style="margin-top:0">Favoriten</h2>`:`<div class="row" style="margin-bottom:10px"><input id="q" placeholder="Ticker oder Firmenname (z. B. NVDA, Tesla)"><button id="add">+</button></div><div id="res"></div>`}
  <div id="list"></div>${items.length?"":(fav?`<div class="card mut">Noch keine Favoriten. Tippe in der Watchlist auf den Stern.</div>`:`<div class="card"><p>Noch leer.</p><button id="sug">Vorschlagsliste laden (Mag7 + 8 weitere)</button></div>`)}
  <p class="disc">Analyse- und Szenarioinstrument, keine Anlageberatung oder Kaufempfehlung. Daten können verzögert oder fehlerhaft sein. Watchlist und Favoriten gelten für alle Nutzer gemeinsam.</p>`;
  if($("#sug"))$("#sug").onclick=async()=>{await sb.from("watchlist").upsert(SUGGEST.map(t=>({ticker:t})),{onConflict:"ticker",ignoreDuplicates:true});viewWatch(fav)};
  if(!fav){$("#add").onclick=search;$("#q").onkeydown=e=>{if(e.key==="Enter")search()}}
  const list=$("#list");
  for(const w of items){
    list.insertAdjacentHTML("beforeend",`<div class="card row" data-t="${esc(w.ticker)}" style="cursor:pointer"><div class="row" style="justify-content:flex-start;gap:6px"><button class="star" data-s="${esc(w.ticker)}">${w.favorite?"★":"☆"}</button><div><span class="tick">${esc(w.ticker)}</span><div class="mut">${esc(w.name||"")}</div></div></div><div id="p-${esc(w.ticker)}" style="text-align:right">…</div></div>`)}
  list.querySelectorAll(".card").forEach(el=>el.onclick=()=>go("stock",el.dataset.t));
  list.querySelectorAll(".star").forEach(b=>b.onclick=async e=>{e.stopPropagation();const w=watch.find(x=>x.ticker===b.dataset.s);await toggleFav(w);viewWatch(fav)});
  for(const w of items){try{const q=await fh("quote",{symbol:w.ticker});const el=document.getElementById("p-"+w.ticker);
    if(el&&(tab==="watch"||tab==="fav"))el.innerHTML=`${f(q.c)}<div>${pc(q.dp)}</div>`}catch(e){const el=document.getElementById("p-"+w.ticker);if(el)el.innerHTML=`<span class="mut">n/a</span>`}}
}
async function search(){
  const q=$("#q").value.trim();if(!q)return;
  try{const r=await fh("search",{q});const items=(r.result||[]).filter(x=>!x.symbol.includes(".")).slice(0,6);
    $("#res").innerHTML=items.map(x=>`<div class="card row"><div><span class="tick">${esc(x.symbol)}</span> <span class="mut">${esc(x.description)}</span></div><button class="sm" data-s="${esc(x.symbol)}" data-n="${esc(x.description)}">Hinzufügen</button></div>`).join("")||`<p class="mut">Nichts gefunden.</p>`;
    $("#res").querySelectorAll("button").forEach(b=>b.onclick=async()=>{await sb.from("watchlist").upsert({ticker:b.dataset.s,name:b.dataset.n},{onConflict:"ticker",ignoreDuplicates:true});viewWatch(false)})
  }catch(e){$("#res").innerHTML=`<p class="dn">${esc(e.message)}</p>`}}

/* ---------- Aktien-Detail ---------- */
async function viewStock(t){
  if(!watch.length)await loadWatch();
  const w0=watch.find(x=>x.ticker===t);
  $("#v").innerHTML=`<div class="row"><button class="sec sm" id="back">← Zurück</button>${w0?`<button class="sec sm" id="rm">Entfernen</button>`:""}</div><h2 style="margin-top:12px">${esc(t)} ${w0?`<button class="star" id="fv">${w0.favorite?"★":"☆"}</button>`:""} <span class="mut" style="font-weight:400">${esc(w0?.name||"")}</span></h2><div id="q" class="mut">Lade…</div><div id="chart"></div><div id="body"></div>`;
  $("#back").onclick=()=>go("watch");
  if($("#fv"))$("#fv").onclick=async()=>{await toggleFav(w0);$("#fv").textContent=w0.favorite?"★":"☆"};
  if($("#rm"))$("#rm").onclick=async()=>{if(confirm(t+" aus der gemeinsamen Watchlist entfernen?")){await sb.from("watchlist").delete().eq("ticker",t);go("watch")}};
  const now=Math.floor(Date.now()/1000),yr=now-400*86400;
  const day=ts=>new Date(ts*1000).toISOString().slice(0,10);
  let q,candles,candleErr=null;
  try{q=await fh("quote",{symbol:t});$("#q").innerHTML=`${f(q.c)} ${pc(q.dp)} <span class="mut"> · Vortag ${f(q.pc)} · Tag ${f(q.l)}–${f(q.h)}</span>`}catch(e){$("#q").innerHTML=`<span class="dn">${esc(e.message)}</span>`}
  try{candles=await fh("candles",{symbol:t});if(candles.s!=="ok")throw new Error(candles.error||"Keine Tageskerzen geliefert")}
  catch(e){candleErr=e.message;candles=null}
  let d=null,earn=null;
  if(candles){
    d={t:candles.t,o:candles.o,h:candles.h,l:candles.l,c:candles.c,v:candles.v};
    const ch=LightweightCharts.createChart($("#chart"),{layout:{background:{color:"#0f1115"},textColor:"#8b93a1"},grid:{vertLines:{color:"#1b1f29"},horzLines:{color:"#1b1f29"}},timeScale:{borderColor:"#262b36"},rightPriceScale:{borderColor:"#262b36"}});
    const cs=ch.addCandlestickSeries({upColor:"#2ecc71",downColor:"#ff5c5c",borderVisible:false,wickUpColor:"#2ecc71",wickDownColor:"#ff5c5c"});
    cs.setData(d.t.map((x,i)=>({time:day(x),open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i]})));
    for(const [n,col] of [[20,"#5b9dff"],[50,"#f5a623"]]){const s=ch.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false});
      const m=sma(d.c,n);s.setData(d.t.map((x,i)=>m[i]==null?null:{time:day(x),value:m[i]}).filter(Boolean))}
    ch.timeScale().fitContent();
  }
  // Earnings-Termine + Historie
  let cal=[],eh=[];
  try{const c=await fh("calendar/earnings",{symbol:t,from:day(now-800*86400),to:day(now+120*86400)});cal=(c.earningsCalendar||[]).sort((a,b)=>a.date<b.date?-1:1)}catch(e){}
  try{eh=await fh("stock/earnings",{symbol:t,limit:12})}catch(e){}
  const today=day(now),nxt=cal.find(x=>x.date>=today);
  if(nxt)earn={days:Math.round((new Date(nxt.date)-new Date(today))/86400000),date:nxt.date,hour:nxt.hour};
  let html="";
  if(candleErr)html+=`<div class="card"><b>Tageskerzen nicht verfügbar</b><p class="mut">${esc(candleErr)}<br>Prüfe den Tab „Status".</p></div>`;
  if(earn)html+=`<div class="card">Nächste Earnings: <b>${esc(earn.date)}</b> (${earn.days} Tage${earn.hour==="bmo"?", vor Börsenöffnung":earn.hour==="amc"?", nach Börsenschluss":""})</div>`;
  if(d){
    const sc=scenarios(d,earn),i=sc.ind;
    html+=`<div class="card"><span class="tag">RSI ${f(i.r,0)}</span><span class="tag">ATR ${f(i.a)} (${f(i.atrPct,1)} %)</span><span class="tag">SMA20 ${f(i.s20)}</span><span class="tag">SMA50 ${f(i.s50)}</span>
      <div class="mut" style="margin-top:6px">Widerstände: ${i.lv.res.slice(0,3).map(x=>f(x)).join(" · ")||"–"}<br>Unterstützungen: ${i.lv.sup.slice(0,3).map(x=>f(x)).join(" · ")||"–"}</div></div>
      <h2>Szenarien</h2><div class="card">${sc.out.map(s=>`<div class="sc ${s.t}"><b>${esc(s.h)}</b><div>${esc(s.b)}</div></div>`).join("")}</div>`;
    // Earnings-Reaktionen
    const rows=[];
    for(const e of cal.filter(x=>x.date<today).slice(-12).reverse()){
      const idx=d.t.findIndex(x=>day(x)>=e.date);if(idx<1)continue;
      let a0,a1;
      if(e.hour==="bmo"){a0=d.c[idx-1];a1=d.c[idx]}else{a0=d.c[idx];a1=d.c[idx+1]}
      if(a0==null||a1==null)continue;
      const gap=e.hour==="bmo"?(d.o[idx]/d.c[idx-1]-1)*100:(d.o[idx+1]!=null?(d.o[idx+1]/d.c[idx]-1)*100:null);
      const sur=e.epsActual!=null&&e.epsEstimate?((e.epsActual-e.epsEstimate)/Math.abs(e.epsEstimate))*100:null;
      rows.push({date:e.date,hour:e.hour,sur,gap,mv:(a1/a0-1)*100})}
    if(rows.length){const avg=rows.reduce((s,r)=>s+Math.abs(r.mv),0)/rows.length,ups=rows.filter(r=>r.mv>0).length;
      html+=`<h2>Kursreaktion bei Earnings</h2><div class="card"><div class="mut" style="margin-bottom:6px">Ø Bewegung ${f(avg)} % (absolut) · ${ups} von ${rows.length} positiv · kleine Stichprobe, keine Prognose</div>
      <table><tr><th>Datum</th><th>EPS-Überr.</th><th>Gap</th><th>Reaktion</th></tr>${rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${r.sur==null?"–":pc(r.sur)}</td><td>${r.gap==null?"–":pc(r.gap)}</td><td>${pc(r.mv)}</td></tr>`).join("")}</table></div>`}
    else html+=`<h2>Kursreaktion bei Earnings</h2><div class="card mut">Keine Earnings-Termine für die Auswertung verfügbar.</div>`;
    // Tagesverlauf der letzten Tage
    html+=`<h2>Auffälligkeiten (letzte 5 Handelstage)</h2><div class="card"><table><tr><th>Tag</th><th>Gap</th><th>Tag</th><th>Spanne</th><th>Vol. vs Ø20</th></tr>`;
    const vAvg=d.v.slice(-25,-5).reduce((s,x)=>s+x,0)/20;
    for(let k=d.c.length-1;k>=Math.max(1,d.c.length-5);k--){
      const gap=(d.o[k]/d.c[k-1]-1)*100,dy=(d.c[k]/d.o[k]-1)*100,rg=(d.h[k]-d.l[k])/d.c[k-1]*100,vr=d.v[k]/vAvg;
      html+=`<tr><td>${day(d.t[k]).slice(5)}</td><td>${pc(gap)}</td><td>${pc(dy)}</td><td>${f(rg,1)} %</td><td>${f(vr,1)}×</td></tr>`}
    html+=`</table><p class="mut">Zeitfenster-Auswertung (z. B. Vorbörse, Eröffnung, Mittag) folgt mit Intraday-Daten.</p></div>`;
  }
  // News
  try{const n=await fh("company-news",{symbol:t,from:day(now-7*86400),to:today});
    html+=`<h2>News (7 Tage)</h2><div class="card">${(n||[]).slice(0,8).map(x=>`<div style="margin-bottom:10px"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.headline)}</a><div class="mut">${esc(x.source)} · ${new Date(x.datetime*1000).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}</div></div>`).join("")||"<span class='mut'>Keine News.</span>"}</div>`}catch(e){}
  html+=`<p class="disc">Regelbasierte Szenarien auf Basis von Tagesdaten. Keine Anlageberatung, keine Kauf- oder Verkaufsempfehlung.</p>`;
  $("#body").innerHTML=html+`<h2>Notizen</h2><div id="nz"></div>`;renderNotes($("#nz"),t);
}

/* ---------- Earnings-Kalender (Monatsansicht) ---------- */
let calOff=0;
async function viewCal(){
  await loadWatch();
  const now=new Date(),base=new Date(Date.UTC(now.getFullYear(),now.getMonth()+calOff,1));
  const y=base.getUTCFullYear(),m=base.getUTCMonth(),last=new Date(Date.UTC(y,m+1,0));
  const iso=d=>d.toISOString().slice(0,10),todayIso=iso(new Date());
  $("#v").innerHTML=`<div class="row" style="margin-bottom:10px"><button class="sec sm" id="pm">←</button><h2 style="margin:0">${base.toLocaleDateString("de-DE",{month:"long",year:"numeric",timeZone:"UTC"})}</h2><button class="sec sm" id="nm">→</button></div><div id="c" class="mut">Lade…</div>`;
  $("#pm").onclick=()=>{calOff--;viewCal()};$("#nm").onclick=()=>{calOff++;viewCal()};
  if(!watch.length){$("#c").innerHTML=`<div class="card">Die Watchlist ist leer. Füge zuerst Aktien hinzu.</div>`;return}
  try{
    const map=new Map(watch.map(w=>[w.ticker,w]));
    const res=await Promise.all(watch.map(w=>fh("calendar/earnings",{symbol:w.ticker,from:iso(base),to:iso(last)}).then(r=>r.earningsCalendar||[]).catch(()=>[])));
    const ev=res.flat().filter(x=>map.has(x.symbol)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.symbol<b.symbol?-1:1);
    const by={};ev.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));
    const off=(base.getUTCDay()+6)%7;
    let g=["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>`<div class="mut" style="text-align:center;font-size:11px">${d}</div>`).join("");
    for(let i=0;i<off;i++)g+=`<div></div>`;
    for(let d=1;d<=last.getUTCDate();d++){
      const key=iso(new Date(Date.UTC(y,m,d)));
      g+=`<div class="cd ${key===todayIso?"today":""}"><b>${d}</b>${(by[key]||[]).map(x=>`<span class="ev ${map.get(x.symbol).favorite?"fav":""}" data-t="${esc(x.symbol)}">${esc(x.symbol)}</span>`).join("")}</div>`}
    const hour=h=>h==="bmo"?"vor Öffnung":h==="amc"?"nach Schluss":"–";
    $("#c").innerHTML=`<div class="cal">${g}</div><h2>Termine im Monat</h2>`+(ev.length?`<div class="card"><table><tr><th>Datum</th><th>Aktie</th><th>Zeit</th><th>EPS-Schätzung</th></tr>${ev.map(x=>`<tr data-t="${esc(x.symbol)}"><td>${esc(x.date.slice(8,10)+"."+x.date.slice(5,7)+".")}</td><td>${map.get(x.symbol).favorite?"★ ":""}${esc(x.symbol)}</td><td>${hour(x.hour)}</td><td>${f(x.epsEstimate)}</td></tr>`).join("")}</table></div>`:`<div class="card mut">Keine Earnings von Aktien der Watchlist in diesem Monat.</div>`)+`<p class="mut">Gelb markiert = Favorit. Termine können sich noch verschieben.</p>`;
    document.querySelectorAll("#c [data-t]").forEach(el=>el.onclick=()=>go("stock",el.dataset.t));
  }catch(e){$("#c").innerHTML=`<span class="dn">${esc(e.message)}</span>`}
}

/* ---------- Notizen (für alle Nutzer sichtbar) ---------- */
const nm=e=>{const x=String(e||"?").split("@")[0].split(/[._-]/)[0];return x.charAt(0).toUpperCase()+x.slice(1)};
async function renderNotes(el,ticker){
  let q=sb.from("notes").select("*").order("created_at",{ascending:false}).limit(100);
  if(ticker)q=q.eq("ticker",ticker);
  const {data,error}=await q,me=session?.user?.id;
  el.innerHTML=`<div class="card"><textarea id="nb" rows="3" placeholder="Notiz schreiben…"></textarea>
    ${ticker?"":`<input id="nt" placeholder="Ticker (optional, z. B. NVDA)" style="margin-top:6px">`}
    <label class="mut" style="display:block;margin:8px 0"><input type="checkbox" id="nf" style="width:auto;margin-right:6px">Hinweis an den anderen (hervorgehoben)</label>
    <button id="ns">Speichern</button><p id="nmsg" class="mut"></p></div><div id="nl">${error?`<span class="dn">${esc(error.message)}</span>`:""}</div>`;
  $("#nl").insertAdjacentHTML("beforeend",(data||[]).map(n=>`<div class="card ${n.for_other?"hint":""}"><div class="row"><span><span class="tag">${esc(nm(n.author))}${n.user_id===me?" (du)":""}</span>${n.ticker&&!ticker?`<span class="tag" data-t="${esc(n.ticker)}" style="cursor:pointer">${esc(n.ticker)}</span>`:""}${n.for_other?`<span class="tag">Hinweis</span>`:""}</span><span class="mut">${esc(new Date(n.created_at).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}))}</span></div><div style="white-space:pre-wrap;margin-top:6px">${esc(n.body)}</div>${n.user_id===me?`<button class="sec sm" data-del="${esc(n.id)}" style="margin-top:8px">Löschen</button>`:""}</div>`).join("")||(error?"":`<div class="card mut">Noch keine Notizen.</div>`));
  $("#ns").onclick=async()=>{
    const body=$("#nb").value.trim();if(!body)return;
    const tk=ticker||($("#nt")?.value.trim().toUpperCase()||null);
    const {error:e}=await sb.from("notes").insert({body,ticker:tk,for_other:$("#nf").checked});
    if(e){$("#nmsg").textContent=e.message;return}
    renderNotes(el,ticker)};
  el.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Notiz löschen?")){await sb.from("notes").delete().eq("id",b.dataset.del);renderNotes(el,ticker)}});
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go("stock",b.dataset.t));
}
function viewNotes(){$("#v").innerHTML=`<h2 style="margin-top:0">Notizen</h2><p class="mut">Alle Notizen sind für euch beide sichtbar. Löschen kann jeder nur die eigenen.</p><div id="nz"></div>`;renderNotes($("#nz"),null)}

/* ---------- Status / Diagnose ---------- */
async function viewDiag(){
  $("#v").innerHTML=`<h2>Datenstatus</h2><div class="card"><p class="mut">Prüft, welche Daten (Finnhub, Twelve Data) verfügbar sind.</p><button id="run">Diagnose starten</button><pre id="o"></pre></div>`;
  $("#run").onclick=async()=>{$("#o").textContent="Läuft…";
    try{const r=await fh("diagnose",{});$("#o").textContent=Object.entries(r).map(([k,v])=>`${v.status===200?"✅":"❌"} ${k}  (HTTP ${v.status})\n   ${String(v.sample).slice(0,110).replace(/\n/g," ")}`).join("\n\n")}
    catch(e){$("#o").textContent=e.message}}}

sb.auth.onAuthStateChange((_e,s)=>{session=s;s?shell():loginView()});
sb.auth.getSession().then(({data})=>{if(!data.session)loginView()});
</script>
